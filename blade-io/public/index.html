<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<title>BLADE.IO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4eee0; --paper-2:#fbf6e8;
    --ink:#1a1d24; --ink-soft:#2d3340;
    --muted:#7a7568; --line:rgba(26,29,36,.12);
    --you:#2a8a5f; --you-glow:#5fc28d;
    --hot:#d94a5e; --warn:#e09f3e;
    --cool:#3a8db5; --plum:#8a5b9c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
  body{background:radial-gradient(circle at 30% 20%, #fbf6e8 0%, #f4eee0 50%, #ebe2cb 100%)}
  #wrap{position:fixed;inset:0}
  canvas#game{display:block;width:100%;height:100%;background:transparent}
  #topBar{position:fixed;top:calc(8px + var(--safe-top));left:8px;right:8px;z-index:6;display:flex;gap:6px;pointer-events:none}
  .pill{background:rgba(255,253,245,.85);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 8px rgba(60,50,30,.06);padding:6px 10px;display:flex;align-items:center;gap:8px}
  .pill .lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;line-height:1}
  .pill .val{font-size:15px;font-weight:700;color:var(--ink);line-height:1;font-feature-settings:'tnum'}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:0}
  .vsep{width:1px;height:20px;background:var(--line)}
  #statsLeft{flex:1;min-width:0;overflow:hidden}
  #statsRight{flex:0 0 auto}
  #hpRow{display:flex;align-items:center;gap:6px;margin-top:4px}
  .miniBar{height:4px;flex:1;background:rgba(26,29,36,.08);border-radius:99px;overflow:hidden;min-width:30px}
  .miniBar > i{display:block;height:100%;border-radius:99px;transition:width .15s}
  #hpFill{background:linear-gradient(90deg,#d94a5e,#e09f3e)}
  #xpFill{background:linear-gradient(90deg,#2a8a5f,#3a8db5)}
  #board{position:fixed;top:calc(82px + var(--safe-top));right:8px;z-index:6;background:rgba(255,253,245,.85);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 8px rgba(60,50,30,.06);padding:6px 8px;pointer-events:auto;cursor:pointer;transition:padding .2s}
  #board.collapsed{padding:4px 8px}
  #board h3{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:500;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  #board.collapsed h3{margin-bottom:0}
  #board .chev{font-size:8px;opacity:.5;transition:transform .2s}
  #board.collapsed .chev{transform:rotate(-90deg)}
  #boardRows{font-size:11px}
  #boardRows .row{display:flex;align-items:center;gap:6px;padding:1px 0;color:var(--ink-soft)}
  #boardRows .rk{font-family:'DM Mono',monospace;color:var(--muted);width:14px;text-align:right;font-size:10px}
  #boardRows .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
  #boardRows .ms{font-family:'DM Mono',monospace;color:var(--ink);font-size:10px}
  #boardRows .you{color:var(--you);font-weight:600}
  #boardRows .you .ms,#boardRows .you .rk{color:var(--you)}
  #board.collapsed #boardRows{display:none}
  #mini{position:fixed;bottom:calc(140px + var(--safe-bot));right:8px;width:100px;height:100px;background:rgba(255,253,245,.85);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 8px rgba(60,50,30,.06);z-index:6;pointer-events:none}
  #toasts{position:fixed;top:calc(82px + var(--safe-top));left:8px;z-index:6;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:60vw}
  .toast{background:rgba(255,253,245,.92);border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:11px;color:var(--ink-soft);box-shadow:0 2px 8px rgba(60,50,30,.06);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2);transition:opacity .3s, transform .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .toast b{color:var(--ink)}
  .toast.kill{border-color:var(--you-glow);background:rgba(95,194,141,.18)}
  .toast.kill b{color:var(--you)}
  @keyframes toastIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
  #stick{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(20px + var(--safe-bot));width:140px;height:140px;border-radius:50%;background:rgba(255,253,245,.4);border:2px solid rgba(26,29,36,.15);z-index:7;touch-action:none;box-shadow:0 4px 20px rgba(60,50,30,.08);display:none}
  #stick .nub{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:var(--you);transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(42,138,95,.4);transition:background .1s}
  #stick.active .nub{background:var(--you-glow)}
  #dashBtn{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(28px + var(--safe-bot));width:96px;height:96px;border-radius:50%;background:var(--warn);color:#fff;border:none;font:inherit;font-weight:700;font-size:14px;letter-spacing:.1em;z-index:7;box-shadow:0 6px 20px rgba(224,159,62,.5);cursor:pointer;transition:transform .1s, background .15s;touch-action:manipulation;display:none}
  #dashBtn:active{transform:scale(.92)}
  #dashBtn:disabled{background:rgba(122,117,104,.4);color:rgba(255,255,255,.6);box-shadow:none}
  #dashBtn .cd{display:block;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0;margin-top:2px;opacity:.85}
  @media (hover:none) and (pointer:coarse){#stick,#dashBtn{display:block}}
  @media (hover:hover) and (pointer:fine){
    #topBar{top:14px;left:14px;right:14px;gap:8px}
    .pill{padding:8px 12px;border-radius:12px}
    .pill .lbl{font-size:10px}
    .pill .val{font-size:18px}
    #board{top:calc(72px + var(--safe-top));right:14px;padding:8px 12px;border-radius:12px}
    #board h3{font-size:11px;margin-bottom:6px}
    #boardRows{font-size:13px}
    #boardRows .nm{max-width:140px}
    #boardRows .rk,#boardRows .ms{font-size:12px}
    #mini{bottom:14px;right:14px;width:160px;height:160px;border-radius:12px}
    #toasts{top:auto;bottom:14px;left:50%;transform:translateX(-50%);align-items:center;max-width:400px}
    .toast{font-size:13px;padding:6px 12px}
    #buildTags{display:flex !important}
  }
  #buildTags{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;display:none;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none;max-width:60vw}
  .tag{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;background:rgba(255,253,245,.85);border:1px solid var(--line);padding:4px 9px;border-radius:99px;color:var(--ink-soft);box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
  .tag b{color:var(--ink);font-weight:600}
  .tag.archetype{border-color:var(--you);color:var(--you);background:rgba(95,194,141,.15)}
  #modal{position:fixed;inset:0;display:none;place-items:center;z-index:8;background:rgba(244,238,224,.88);backdrop-filter:blur(8px);padding:16px}
  #modal.show{display:grid}
  .card{background:#fbf6e8;border:1px solid rgba(26,29,36,.08);padding:24px 22px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(60,50,30,.18), 0 1px 0 rgba(255,255,255,.8) inset;border-radius:16px}
  @media (hover:hover) and (pointer:fine){.card{padding:30px 32px;max-width:480px}}
  .card h1{font-family:'Space Grotesk';font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:2px}
  .card .sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;color:var(--muted);margin-bottom:16px;text-transform:uppercase}
  .card p{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-bottom:8px}
  @media (hover:hover) and (pointer:fine){.card h1{font-size:36px}.card p{font-size:16px}}
  .nameRow{display:flex;gap:8px;margin:14px 0 4px}
  input.tag-in{flex:1;font:inherit;font-size:17px;font-weight:600;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s;-webkit-appearance:none}
  input.tag-in:focus{border-color:var(--you)}
  .archChips{display:flex;gap:6px;flex-direction:column;margin:10px 0}
  @media (min-width:520px){.archChips{flex-direction:row;flex-wrap:wrap}.arch{flex:1;min-width:130px}}
  .arch{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;transition:all .15s;display:flex;flex-direction:column;gap:2px}
  .arch:active{transform:scale(.98)}
  .arch.sel{box-shadow:0 0 0 3px rgba(95,194,141,.18)}
  .arch h4{font-size:14px;font-weight:700}
  .arch .archDesc{font-size:12px;color:var(--muted);line-height:1.3}
  .arch .archStats{display:flex;gap:6px;margin-top:5px}
  .archBar{flex:1;display:flex;flex-direction:column;gap:2px}
  .archBar span{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .archBar .b{height:3px;background:rgba(26,29,36,.08);border-radius:99px;overflow:hidden}
  .archBar .b i{display:block;height:100%;border-radius:99px}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .opt{background:#fff;border:2px solid var(--line);color:var(--ink);padding:12px 14px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;transition:all .12s ease;text-align:left;-webkit-tap-highlight-color:transparent}
  .opt:active{transform:scale(.98)}
  .opt:hover,.opt:focus{border-color:var(--you);outline:none;background:rgba(95,194,141,.06)}
  .opt > div{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .opt .name{color:var(--ink);font-weight:700;font-size:14px}
  .opt .desc{font-size:11px;color:var(--muted);text-align:right;line-height:1.3}
  .opt .num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);background:rgba(26,29,36,.05);padding:2px 6px;border-radius:5px}
  .opt.heal{border-color:rgba(217,74,94,.4);background:rgba(217,74,94,.05)}
  .opt.heal .name{color:var(--hot)}
  .opt.shape{border-color:rgba(58,141,181,.4);background:rgba(58,141,181,.05)}
  .opt.shape .name{color:var(--cool)}
  .opt.risk{border-color:rgba(138,91,156,.4);background:rgba(138,91,156,.05)}
  .opt.risk .name{color:var(--plum)}
  .btn{margin-top:12px;background:var(--ink);border:none;color:var(--paper-2);padding:14px 24px;font:inherit;font-size:15px;font-weight:600;letter-spacing:.04em;cursor:pointer;border-radius:10px;width:100%;transition:transform .1s;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.98)}
  .small{font-size:11px;color:var(--muted);margin-top:8px;font-family:'DM Mono',monospace;letter-spacing:.1em;text-align:center}
  .endStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;text-align:center}
  .endStats .lbl{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase}
  .endStats .v{font-size:22px;font-weight:700}
  @media (hover:hover) and (pointer:fine){.endStats .v{font-size:26px}}
  /* Level-up offer panel — floating, non-blocking. World keeps running while
     you decide; auto-picks option 1 after 12s if you don't tap. */
  #lvlPanel{position:fixed;left:50%;top:calc(96px + var(--safe-top));transform:translateX(-50%);z-index:8;display:none;flex-direction:column;gap:6px;width:min(440px, calc(100vw - 24px));pointer-events:auto}
  #lvlPanel.show{display:flex;animation:lvlIn .25s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes lvlIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
  #lvlPanel .lvlHdr{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--ink);text-align:center;background:rgba(255,253,245,.92);border:1px solid var(--line);padding:6px 10px;border-radius:8px;backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(60,50,30,.08);display:flex;justify-content:space-between;align-items:center}
  #lvlPanel .lvlHdr b{color:var(--you);font-weight:700;font-size:12px;letter-spacing:.18em}
  #lvlPanel .lvlHdr .timer{font-size:10px;color:var(--muted);font-feature-settings:'tnum'}
  #lvlPanel .lvlOpts{display:flex;flex-direction:column;gap:6px}
  @media (min-width:520px){#lvlPanel .lvlOpts{flex-direction:row}}
  #lvlPanel .lvlOpt{flex:1;background:#fff;border:2px solid var(--line);color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:10px;transition:all .12s ease;text-align:left;-webkit-tap-highlight-color:transparent;min-height:60px}
  #lvlPanel .lvlOpt:hover,#lvlPanel .lvlOpt:focus{outline:none;border-color:var(--you);background:rgba(95,194,141,.08);transform:scale(1.02)}
  #lvlPanel .lvlOpt:active{transform:scale(.98)}
  #lvlPanel .lvlOpt .nm{font-weight:700;font-size:13px;color:var(--ink)}
  #lvlPanel .lvlOpt .ds{font-size:11px;color:var(--muted);line-height:1.3}
  #lvlPanel .lvlOpt .kb{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);position:absolute;top:6px;right:8px;opacity:.5}
  #lvlPanel .lvlOpt{position:relative}
  #lvlPanel .lvlOpt.heal{border-color:rgba(217,74,94,.5);background:rgba(217,74,94,.06)}
  #lvlPanel .lvlOpt.heal .nm{color:var(--hot)}
  #lvlPanel .lvlOpt.shape{border-color:rgba(58,141,181,.5);background:rgba(58,141,181,.06)}
  #lvlPanel .lvlOpt.shape .nm{color:var(--cool)}
  #lvlPanel .lvlOpt.risk{border-color:rgba(138,91,156,.5);background:rgba(138,91,156,.06)}
  #lvlPanel .lvlOpt.risk .nm{color:var(--plum)}
  #connStatus{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;color:var(--muted);background:rgba(255,253,245,.9);padding:4px 10px;border-radius:99px;border:1px solid var(--line);text-transform:uppercase;display:none}
  #connStatus.show{display:block}
  #connStatus.bad{color:var(--hot);border-color:rgba(217,74,94,.3)}
  #connStatus.good{color:var(--you);border-color:rgba(42,138,95,.3)}
</style>
</head>
<body>

<div id="wrap"><canvas id="game"></canvas></div>

<div id="connStatus">connecting…</div>

<div id="topBar">
  <div class="pill" id="statsLeft">
    <div class="stat" style="min-width:0">
      <div style="display:flex;align-items:center;gap:6px;line-height:1">
        <span class="lbl">LV<b id="lv" style="color:var(--ink);font-size:11px;margin-left:2px">1</b></span>
        <span class="lbl">HP <span id="hpNum" style="color:var(--ink);font-size:11px;font-weight:600">100</span></span>
        <span class="lbl">MASS <span id="massVal" style="color:var(--ink);font-size:11px;font-weight:600">10</span></span>
      </div>
      <div id="hpRow">
        <div class="miniBar"><i id="hpFill" style="width:100%"></i></div>
        <div class="miniBar"><i id="xpFill" style="width:0%"></i></div>
      </div>
    </div>
  </div>
  <div class="pill" id="statsRight">
    <div class="stat" style="text-align:right">
      <span class="lbl">KILLS</span>
      <span class="val" id="killsVal">0</span>
    </div>
    <div class="vsep"></div>
    <div class="stat" style="text-align:right">
      <span class="lbl">PING</span>
      <span class="val" id="pingVal" style="font-family:'DM Mono',monospace;font-size:13px">—</span>
    </div>
    <div class="vsep"></div>
    <button id="muteBtn" title="Toggle sound" style="pointer-events:auto;background:none;border:none;cursor:pointer;font-size:16px;padding:0 4px;line-height:1;color:var(--ink-soft)">🔊</button>
  </div>
</div>

<div id="board" class="collapsed">
  <h3><span>Board</span><span class="chev">▼</span></h3>
  <div id="boardRows"></div>
</div>

<div id="buildTags"></div>
<canvas id="mini" width="320" height="320"></canvas>
<div id="toasts"></div>

<div id="stick"><div class="nub" id="nub"></div></div>
<button id="dashBtn">DASH<span class="cd" id="dashCd">READY</span></button>

<div id="lvlPanel">
  <div class="lvlHdr"><span>// <b>LEVEL UP</b> · pick a path</span><span class="timer" id="lvlTimer">12s</span></div>
  <div class="lvlOpts" id="lvlOpts"></div>
</div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
'use strict';

/* ================================================================
   BLADE.IO — Client
   ----------------------------------------------------------------
   Rendering only. Server is authoritative.
   Local prediction: we move the local player every frame from
   inputs, then snap to server when its snapshot arrives.
   ================================================================ */

const cvs = document.getElementById('game'); const ctx = cvs.getContext('2d');
const mini = document.getElementById('mini'); const mctx = mini.getContext('2d');
const $ = id => document.getElementById(id);
const isTouch = matchMedia('(hover:none) and (pointer:coarse)').matches;
const TAU = Math.PI * 2;

const ARCHETYPES = {
  reaver: {name:'REAVER',desc:'Heavy blades. Slow but devastating.',color:'#d94a5e',stats:{dmg:0.95,range:0.85,speed:0.5}},
  dervish:{name:'DERVISH',desc:'Storm of small fast blades.',color:'#3a8db5',stats:{dmg:0.4,range:0.6,speed:1.0}},
  warden: {name:'WARDEN',desc:'Wide orbit. Holds territory.',color:'#8a5b9c',stats:{dmg:0.7,range:1.0,speed:0.7}},
};

// Saved settings
const ls = (typeof localStorage!=='undefined') ? localStorage : null;
let playerName = (ls && ls.getItem('blade_name')) || 'PLAYER';
let chosenArchetype = (ls && ls.getItem('blade_arch')) || 'dervish';
if (!ARCHETYPES[chosenArchetype]) chosenArchetype = 'dervish';

// ===== Canvas resize =====
// Cap DPR lower on touch devices — iPhones report 3, drawing ~9x pixels of DPR=1.
// 1.5 keeps it crisp at game distances while saving meaningful GPU + battery.
const DPR_CAP = isTouch ? 1.5 : 2;
let VW=0,VH=0,DPR=1;
function resize(){
  DPR = Math.min(DPR_CAP, devicePixelRatio||1);
  VW = innerWidth; VH = innerHeight;
  cvs.width = VW*DPR; cvs.height = VH*DPR;
  cvs.style.width=VW+'px'; cvs.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();
addEventListener('orientationchange',()=>setTimeout(resize,100));

let WORLD = { w: 3600, h: 3600 };
const WORLD_BORDER_INSET = 0;

// HUD refs
const hpFill=$('hpFill'),hpNum=$('hpNum'),xpFill=$('xpFill'),
      lvEl=$('lv'),massVal=$('massVal'),killsVal=$('killsVal'),pingVal=$('pingVal'),
      modal=$('modal'),card=$('card'),boardRows=$('boardRows'),board=$('board'),
      buildTags=$('buildTags'),toasts=$('toasts'),
      dashCdEl=$('dashCd'),dashBtn=$('dashBtn'),connStatus=$('connStatus');
board.addEventListener('click',()=>board.classList.toggle('collapsed'));
// Mute-button wiring lives below in the audio module — _muted/toggleMute/ensureAudio
// aren't defined yet here (TDZ on the let bindings would throw ReferenceError).

// ===== Input =====
const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key===' ') queueDash();
  // Level-up modal: 1/2/3 to pick. Defined further down — guarded for TDZ.
  if (typeof pickLvlOption === 'function' && (e.key === '1' || e.key === '2' || e.key === '3')) {
    pickLvlOption(parseInt(e.key, 10) - 1);
  }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

let stickVec={x:0,y:0,active:false};
const stick=$('stick'),nub=$('nub');
function handleStick(e){
  e.preventDefault();
  const t=e.touches[0]; const r=stick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=t.clientX-cx,dy=t.clientY-cy;
  const max=r.width/2-12,mag=Math.hypot(dx,dy);
  if(mag>max){dx=dx/mag*max;dy=dy/mag*max}
  nub.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  stickVec={x:dx/max,y:dy/max,active:true};
  stick.classList.add('active');
}
function endStick(){
  stickVec={x:0,y:0,active:false};
  nub.style.transform='translate(-50%,-50%)';
  stick.classList.remove('active');
}
stick.addEventListener('touchstart',handleStick,{passive:false});
stick.addEventListener('touchmove',handleStick,{passive:false});

let dashQueued = false;
// Client-side dash prediction so the dash feels instant instead of waiting for
// server round-trip + reconciliation to drag the player forward.
let localDashing = 0;        // remaining dash duration (s)
let localDashDx = 0, localDashDy = 0;
let localDashCd = 0;         // local estimate of dash cooldown (s)
const DASH_DURATION = 0.18;
const DASH_CD_BASE = 1.6;
const DASH_SPEED_MULT = 4.5;
function queueDash(){
  if (!myId || iAmDead) return;
  if (localDashCd > 0) return;
  dashQueued = true;
}

function intent(){
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(stickVec.active){mx=stickVec.x;my=stickVec.y}
  const m=Math.hypot(mx,my);
  if(m>1){mx/=m;my/=m}
  return {mx,my,dash:dashQueued};
}

// ===== Network =====
let ws = null;
let myId = null;
let iAmDead = false;
let connected = false;
let lastSnap = null;       // most recent snapshot
let prevSnap = null;       // previous snapshot, for interpolation
let snapRecvAt = 0;
let prevSnapRecvAt = 0;
const SNAP_INTERVAL = 1/30; // server tick rate
let myKillCount = 0;
let lastInputSentAt = 0;
let pingMs = 0;
let lastPingAt = 0;

// Local prediction state for me
let me = null;             // {x,y,vx,vy,...} predicted

function connStatusSet(text, cls){
  connStatus.textContent = text;
  connStatus.className = cls ? 'show ' + cls : 'show';
  if (cls === 'good') {
    setTimeout(()=>{ if(connStatus.className.includes('good')) connStatus.className=''; }, 1500);
  }
}

function connect(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/ws';
  connStatusSet('connecting…');
  ws = new WebSocket(url);
  ws.onopen = () => {
    connected = true;
    connStatusSet('connected', 'good');
    // schedule ping
    setInterval(()=>{
      if (ws && ws.readyState===1) {
        lastPingAt = performance.now();
        ws.send(JSON.stringify({type:'ping', t: lastPingAt}));
      }
    }, 2000);
  };
  ws.onclose = () => {
    connected = false;
    connStatusSet('disconnected — reconnecting…', 'bad');
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { /* will trigger close */ };
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch(e){ return; }
    handleServerMessage(m);
  };
}

function handleServerMessage(m){
  if (m.type === 'hello') {
    if (m.world) WORLD = m.world;
  } else if (m.type === 'joined') {
    myId = m.id;
    iAmDead = false;
    me = null;
    myKillCount = 0;
    modal.classList.remove('show');
  } else if (m.type === 'reject') {
    showRejected(m.reason || 'Could not join.');
  } else if (m.type === 'snap') {
    prevSnap = lastSnap;
    prevSnapRecvAt = snapRecvAt;
    lastSnap = m.s;
    snapRecvAt = performance.now();

    // Index players + enemies by id, cache "me" — used by render + interpolation
    const pById = new Map();
    for (const p of lastSnap.players) pById.set(p.id, p);
    lastSnap.byId = pById;
    lastSnap.me = myId ? (pById.get(myId) || null) : null;
    const eById = new Map();
    for (const e of lastSnap.enemies) eById.set(e.id, e);
    lastSnap.eById = eById;

    // Process events
    if (lastSnap.events) {
      for (const ev of lastSnap.events) {
        handleEvent(ev);
      }
    }

    // Sync prediction
    const meSnap = lastSnap.me;
    if (meSnap) {
      myKillCount = meSnap.ks || 0;
      // detect level-up — fire the dramatic moment
      if (meSnap.l > prevLevel) {
        const lx = me ? me.x : meSnap.x;
        const ly = me ? me.y : meSnap.y;
        levelUpFlash = 0.55;
        shake = Math.max(shake, 0.32);
        spawnRing(lx, ly, 40, 'rgba(95,194,141,1)', 0.55);
        spawnRing(lx, ly, 90, 'rgba(95,194,141,.65)', 0.8);
        spawnRing(lx, ly, 160, 'rgba(95,194,141,.35)', 1.05);
        burst(lx, ly, '#5fc28d', 36, 420);
        floatText(lx, ly - 90, 'LEVEL ' + meSnap.l, '#5fc28d', 30);
        sfx.levelup();
      }
      prevLevel = meSnap.l;
      // detect death
      if (meSnap.d && !iAmDead) {
        iAmDead = true;
        localDashing = 0; localDashCd = 0;
        comboCount = 0; comboTimer = 0;
        sfx.death();
        showDeath(meSnap);
      } else if (!meSnap.d && iAmDead) {
        iAmDead = false;
        localDashing = 0; localDashCd = 0;
        comboCount = 0; comboTimer = 0;
        prevLevel = meSnap.l;
        modal.classList.remove('show');
      }
      // sync predicted
      if (!me || iAmDead) {
        me = { x: meSnap.x, y: meSnap.y, vx: meSnap.vx, vy: meSnap.vy };
      } else {
        // Proportional blend: small divergence eases in, large pulls hard.
        // Only hard-reset on truly egregious gaps (respawn / teleport).
        const dx = meSnap.x - me.x, dy = meSnap.y - me.y;
        const d = Math.hypot(dx, dy);
        if (d > 800) {
          me.x = meSnap.x; me.y = meSnap.y;
          me.vx = meSnap.vx; me.vy = meSnap.vy;
        } else {
          const blend = Math.min(0.4, d / 400);
          me.x += dx * blend; me.y += dy * blend;
          me.vx = me.vx * 0.65 + meSnap.vx * 0.35;
          me.vy = me.vy * 0.65 + meSnap.vy * 0.35;
        }
      }
    }
  } else if (m.type === 'pong') {
    pingMs = Math.round(performance.now() - m.t);
  }
}

function sendInput(){
  if (!ws || ws.readyState!==1 || !myId || iAmDead) {
    dashQueued = false;
    return;
  }
  const i = intent();
  ws.send(JSON.stringify({type:'input', mx:i.mx, my:i.my, dash:i.dash}));
  if (i.dash) {
    dashQueued = false;
    // Predict the dash locally so the pop is instant — server will confirm.
    if (me && lastSnap && lastSnap.me) {
      let dx = i.mx, dy = i.my;
      const m = Math.hypot(dx, dy);
      if (m < 0.1) {
        const vm = Math.hypot(me.vx, me.vy);
        if (vm > 5) { dx = me.vx / vm; dy = me.vy / vm; }
        else { dx = 0; dy = 0; }
      } else { dx /= m; dy /= m; }
      if (dx || dy) {
        localDashing = DASH_DURATION;
        localDashDx = dx; localDashDy = dy;
        localDashCd = DASH_CD_BASE;
        // Visual flourish on the predicted dash start.
        spawnRing(me.x, me.y, 50, 'rgba(42,138,95,.5)', 0.4);
        burst(me.x, me.y, '#2a8a5f', 8, 260);
        sfx.dash();
      }
    }
  }
}

// ===== Audio (WebAudio synth — zero asset loads) =====
// All sounds are generated programmatically via OscillatorNode + GainNode.
// First user interaction unlocks the AudioContext (browser autoplay policy).
// Mute toggle persists in localStorage.
let _audioCtx = null;
let _muted = (ls && ls.getItem('blade_mute') === '1') || false;
function ensureAudio(){
  if (_muted) return null;
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ _audioCtx = null; return null; }
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function _tone(freq, dur, type, gain, attack){
  const c = ensureAudio(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + (attack || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function _sweep(f0, f1, dur, type, gain){
  const c = ensureAudio(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sawtooth';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function _noise(dur, gain, hpfHz){
  const c = ensureAudio(); if (!c) return;
  const t = c.currentTime;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random()*2-1) * (1 - i/len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'highpass';
  f.frequency.setValueAtTime(hpfHz || 1500, t);
  f.frequency.exponentialRampToValueAtTime(400, t + dur);
  const g = c.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t);
}
const sfx = {

  pwBerserk:  () => { _sweep(440, 880, 0.35, 'sawtooth', 0.10); _tone(220, 0.4, 'square', 0.05); },
  pwMagnet:   () => { _sweep(880, 1760, 0.25, 'triangle', 0.08); },

// ===== Visual effects (purely client-side, from events) =====
const particles = [];
const floats = [];
const rings = [];
let shake = 0;
let deathFlash = 0;
let levelUpFlash = 0;       // 0..1 fade overlay after level up
let prevLevel = 1;          // last seen level — triggers level-up effect on increase

// Per-frame blade-vs-enemy overlap detection for instant visual sparks.
// Cooldown per (blade-index, enemy-id) pair so we don't drown in particles.
// Map (not plain object) so we can .clear() cheaply — the keys are
// `bladeIdx_enemyId` and enemy IDs increment forever, so without periodic
// pruning this would grow until tab refresh.
const bladeSparkT = new Map();
let bladeSparkLastPurge = 0;

// Kill streak combo — fully client-side, visual only.
let comboCount = 0;
let comboTimer = 0;
const COMBO_WINDOW = 3.5;
function bumpCombo(x, y) {
  comboCount++;
  comboTimer = COMBO_WINDOW;
  if (comboCount >= 2) {
    const tier =
      comboCount >= 20 ? 'UNSTOPPABLE' :
      comboCount >= 10 ? 'RAMPAGE' :
      comboCount >= 5  ? `${comboCount}x COMBO` :
      comboCount >= 3  ? 'TRIPLE!' :
                         'DOUBLE!';
    const size = 18 + Math.min(22, comboCount * 1.6);
    floatText(x, y - 50, tier, '#ffaa44', size);
    if (comboCount === 3 || comboCount === 5 || comboCount === 10 || comboCount === 20) {
      shake = Math.max(shake, 0.18);
      spawnRing(x, y, 50 + comboCount * 4, '#ffaa44', 0.6);
    }
  }
}

// Hard caps + early-return. The earlier splice(0, n) cap was O(n) per
// overflow which fired every frame during heavy combat (boss waves, kill
// chains) — that's the "dmg lag" people felt. Now: drop new particles
// silently when the array is full. Visually the burst pile-up gracefully
// degrades; perf stays flat.
const PARTICLE_CAP = 180;
const FLOAT_CAP = 28;
function burst(x,y,color,n,spd){
  if (particles.length >= PARTICLE_CAP) return;
  const room = PARTICLE_CAP - particles.length;
  if (n > room) n = room;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = spd * 0.3 + Math.random() * spd * 0.7;
    particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.25 + Math.random()*0.3, max: 0.55, color});
  }
}
function spawnRing(x,y,r,color,life){
  if (rings.length >= 32) return;        // upper bound — visual UX cap
  rings.push({x,y,r0:r*0.4,r1:r*1.6,color,life,max:life});
}
function floatText(x,y,text,color,size){
  if (floats.length >= FLOAT_CAP) return;  // drop new — old fades naturally
  floats.push({x,y,text,color,size,life:1.1,max:1.1,vy:-50});
}
function pushToast(html, cls=''){
  const el = document.createElement('div');
  el.className = 'toast '+cls;
  el.innerHTML = html;
  toasts.appendChild(el);
  while(toasts.children.length>3) toasts.removeChild(toasts.firstChild);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-12px)';setTimeout(()=>el.remove(),300);},2400);
}

const lvlOptsEl = $('lvlOpts');
const lvlTimerEl = $('lvlTimer');

function handleEvent(ev){
  if (ev.type === 'hit') {
    // small burst at the hit player; if it's me, gentle shake
    burst(ev.x, ev.y, '#d94a5e', 3, 100);
    if (ev.id === myId) { shake = Math.max(shake, 0.08); sfx.hurt(); }
  } else if (ev.type === 'dmg') {
    // Damage numbers — only show our own. Event x/y is the blade-tip impact
    // point. During heavy combat we hit the cap and skip — that's fine,
    // the visible damage number cluster doesn't need every single hit.
    if (ev.killerId === myId && ev.dmg >= 0.5) {
      const isCrit = ev.dmg >= 8;
      const jx = (Math.random()-0.5) * 8;
      const txt = ev.dmg >= 10 ? Math.round(ev.dmg).toString() : ev.dmg.toFixed(1);
      const col = isCrit ? '#ffd455' : '#fff7e0';
      const sz = isCrit ? 16 : 12;
      floatText(ev.x + jx, ev.y - 6, txt, col, sz);
      // Crit always gets a burst; non-crit only when particle pressure is low.
      if (isCrit) {
        burst(ev.x, ev.y, col, 3, 140);
      } else if (particles.length < 80) {
        burst(ev.x, ev.y, col, 1, 70);
      }
    }
  } else if (ev.type === 'enemy_killed') {
    const isChampion = ev.kind === 'champion';
    // Champion always gets the big visual; small mobs scale down when
    // particles are stacking so chained kills don't snowball pressure.
    const smallN = particles.length > 100 ? 3 : 6;
    burst(ev.x, ev.y, isChampion ? '#ffd455' : '#7a7568', isChampion ? 22 : smallN, isChampion ? 360 : 160);
    if (ev.killerId === myId) {
      bumpCombo(ev.x, ev.y);
      if (isChampion) {
        shake = Math.max(shake, 0.45);
        spawnRing(ev.x, ev.y, 110, '#ffd455', 1.0);
        spawnRing(ev.x, ev.y, 70, '#ffd455', 0.7);
        floatText(ev.x, ev.y - 40, 'CHAMPION DOWN', '#ffd455', 22);
        pushToast(`<b>CHAMPION DOWN</b> · +${ev.xp} XP`, 'kill');
        sfx.champKill();
      } else if (ev.xp >= 1) {
        floatText(ev.x, ev.y - 6, '+' + ev.xp + ' XP', '#5fc28d', 12);
        // Cheap kills get the soft chime; gate to keep audio sparse during waves.
        if (Math.random() < 0.5) sfx.enemyKill();
      }
    }
  } else if (ev.type === 'champion_spawn') {
    spawnRing(ev.x, ev.y, 90, '#ffd455', 1.1);
    spawnRing(ev.x, ev.y, 50, '#ffd455', 0.8);
    burst(ev.x, ev.y, '#ffd455', 14, 240);
    pushToast(`<b>CHAMPION</b> incoming!`, 'kill');
  } else if (ev.type === 'boss_wave_warning') {
    // 3 s before the swarm — escalating tension.
    pushToast(`<b>WAVE ${ev.wave}</b> incoming · ${ev.n} champion${ev.n>1?'s':''}`, 'kill');
    sfx.bossWarn();
    shake = Math.max(shake, 0.18);
    deathFlash = Math.max(deathFlash, 0.4); // brief red wash as warning
  } else if (ev.type === 'boss_wave') {
    // The actual spawn moment — heavy shake + flash.
    shake = Math.max(shake, 0.55);
    deathFlash = Math.max(deathFlash, 0.7);
  } else if (ev.type === 'kill') {
    burst(ev.x, ev.y, ev.color || '#d94a5e', 30, 400);
    spawnRing(ev.x, ev.y, 100, ev.color || '#d94a5e', 0.7);
    if (ev.killerId === myId) {
      bumpCombo(ev.x, ev.y);
      shake = Math.max(shake, 0.25);
      floatText(ev.x, ev.y - 30, `+${Math.floor((ev.mass||0)*0.3)} mass`, '#2a8a5f', 24);
      pushToast(`You ate <b>${escapeHtml(ev.victimName)}</b>`, 'kill');
      sfx.playerKill();
    } else if (ev.victimId === myId) {
      // handled in 'snap' (death detection)
    } else {
      pushToast(`<b>${escapeHtml(ev.killerName||'?')}</b> ate <b>${escapeHtml(ev.victimName)}</b>`);
    }
  } else if (ev.type === 'dash') {
    // Skip self — we already spawned the ring/burst at the local-predicted position.
    if (ev.id !== myId) {
      spawnRing(ev.x, ev.y, 50, 'rgba(42,138,95,.5)', 0.4);
      burst(ev.x, ev.y, '#2a8a5f', 8, 260);
    }
  } else if (ev.type === 'shrine_used') {
    spawnRing(ev.x, ev.y, 80, 'rgba(42,138,95,.6)', 0.6);
    burst(ev.x, ev.y, '#2a8a5f', 12, 180);
    if (ev.playerId === myId) { floatText(ev.x, ev.y - 40, '+50% HP', '#2a8a5f', 22); sfx.shrine(); }
  } else if (ev.type === 'augment_spawn') {
    spawnRing(ev.x, ev.y, 36, 'rgba(58,141,181,.6)', 0.5);
    if (ev.ownerId === myId) {
      pushToast(`Level up! Grab the augment near you.`, 'kill');
    }
  } else if (ev.type === 'augment_pickup') {
    const col = ev.tag === 'heal' ? '#d94a5e' : (ev.tag === 'shape' ? '#3a8db5' : (ev.tag === 'risk' ? '#8a5b9c' : '#2a8a5f'));
    spawnRing(ev.x, ev.y, 60, col, 0.6);
    burst(ev.x, ev.y, col, 14, 220);
    if (ev.playerId === myId) {
      floatText(ev.x, ev.y - 40, ev.name, col, 22);
      pushToast(`Got <b>${escapeHtml(ev.name)}</b>`, 'kill');
      sfx.augment();
    }
  } else if (ev.type === 'powerup_spawn') {
    spawnRing(ev.x, ev.y, 50, '#ffd455', 0.55);
    sfx.pwSpawn();
  } else if (ev.type === 'powerup_pickup') {
    const colByKind = { shield:'#ffd455', berserk:'#d94a5e', magnet:'#3a8db5', slowmo:'#8a5b9c' };
    const labelByKind = { shield:'SHIELD', berserk:'BERSERK', magnet:'MAGNET+', slowmo:'SLOW-MO' };
    const c = colByKind[ev.kind] || '#fff';
    spawnRing(ev.x, ev.y, 90, c, 0.7);
    spawnRing(ev.x, ev.y, 50, c, 0.5);
    burst(ev.x, ev.y, c, 22, 280);
    if (ev.playerId === myId) {
      floatText(ev.x, ev.y - 40, labelByKind[ev.kind] || ev.kind.toUpperCase(), c, 24);
      shake = Math.max(shake, 0.18);
      // Kind-specific audio cue.
      if (ev.kind === 'shield')  sfx.pwShield();
      else if (ev.kind === 'berserk') sfx.pwBerserk();
      else if (ev.kind === 'magnet')  sfx.pwMagnet();
      else if (ev.kind === 'slowmo')  sfx.pwSlowmo();
    }
  } else if (ev.type === 'execute') {
    // Dash-execute: golden flash + clang. Only my own.
    if (ev.killerId === myId) {
      spawnRing(ev.x, ev.y, 70, '#ffd455', 0.45);
      burst(ev.x, ev.y, '#ffd455', 14, 240);
      floatText(ev.x, ev.y - 28, 'EXECUTE', '#ffd455', 20);
      shake = Math.max(shake, 0.2);
      sfx.execute();
    }
  } else if (ev.type === 'explode') {
    // Exploder death blast — visible to all, hurts whoever's near.
    spawnRing(ev.x, ev.y, ev.r * 2, '#e09f3e', 0.45);
    spawnRing(ev.x, ev.y, ev.r, '#d94a5e', 0.35);
    burst(ev.x, ev.y, '#e09f3e', 30, 340);
    sfx.explode();
  } else if (ev.type === 'summon') {
    spawnRing(ev.x, ev.y, 40, '#8a5b9c', 0.45);
    burst(ev.x, ev.y, '#8a5b9c', 10, 160);
    sfx.summon();
  } else if (ev.type === 'levelup_offer') {
    if (ev.playerId === myId) {
      showLvlOffer(ev.options);
      sfx.levelup();
    }
  } else if (ev.type === 'levelup_resolved') {
    if (ev.playerId === myId) {
      hideLvlOffer();
      const col = ev.tag === 'heal' ? '#d94a5e' : (ev.tag === 'shape' ? '#3a8db5' : (ev.tag === 'risk' ? '#8a5b9c' : '#5fc28d'));
      pushToast(`${ev.auto ? 'Auto-picked' : 'Got'} <b>${escapeHtml(ev.name)}</b>`, 'kill');
      if (me) {
        burst(me.x, me.y, col, 14, 220);
        spawnRing(me.x, me.y, 60, col, 0.5);
      }
    }
  } else if (ev.type === 'evolution_unlocked') {
    if (ev.playerId === myId) {
      shake = Math.max(shake, 0.5);
      levelUpFlash = 0.8;
      pushToast(`<b>EVOLUTION · ${escapeHtml(ev.name)}</b> · ${escapeHtml(ev.desc)}`, 'kill');
      if (me) {
        floatText(me.x, me.y - 100, ev.name, '#ffd455', 32);
        spawnRing(me.x, me.y, 80, '#ffd455', 0.6);
        spawnRing(me.x, me.y, 160, '#ffd455', 0.9);
        spawnRing(me.x, me.y, 260, '#ffd455', 1.2);
        burst(me.x, me.y, '#ffd455', 40, 460);
      }
      sfx.champKill();   // re-uses the dramatic descending sweep
      setTimeout(() => sfx.levelup(), 250);
    }
  } else if (ev.type === 'meteor_warning') {
    // Telegraph — the falling fireball is rendered each frame from
    // lastSnap.meteors; this just plays a tense audio cue.
    sfx.bossWarn();
  } else if (ev.type === 'meteor_impact') {
    spawnRing(ev.x, ev.y, ev.r * 2.4, '#e09f3e', 0.55);
    spawnRing(ev.x, ev.y, ev.r * 1.4, '#d94a5e', 0.4);
    burst(ev.x, ev.y, '#e09f3e', 36, 460);
    if (me && Math.hypot(me.x - ev.x, me.y - ev.y) < 800) {
      shake = Math.max(shake, 0.4);
    }
    sfx.explode();
  }
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ===== Render-side helpers (kept identical to single-player) =====
function pRadius(p){return 14 + Math.sqrt(p.m)*1.6}
function pBladeRadius(p){return p.br + Math.sqrt(p.m)*1.8}    // outer tip
function pBladeInner(p){return pRadius(p) + 2}                 // line start
function pBladeSize(p){return p.bz + Math.sqrt(p.m)*0.5}
function pView(p){return 1 + Math.min(0.7, p.m*0.0022)}
function pSpeed(p){return Math.max(140, (260 - Math.sqrt(p.m)*7))}

// Body sprite atlas — bake each archetype × (you/them) into an offscreen
// canvas once, then draw with a single drawImage instead of 5 path ops +
// shadowBlur per body per frame. With 15 visible players × 60 fps that's
// ~4500 path ops/sec eliminated. Big mobile GPU win.
const SPRITE_R = 32;       // base body radius in the sprite
const SPRITE_PAD = 18;     // shadow bleed margin
const SPRITE_HALF = SPRITE_R + SPRITE_PAD;
const _bodySprites = {};
function getBodySprite(arch, isYou) {
  const key = arch + ':' + (isYou ? 'y' : 'n');
  if (_bodySprites[key]) return _bodySprites[key];
  const c = document.createElement('canvas');
  c.width = c.height = SPRITE_HALF * 2;
  const cx = c.getContext('2d');
  cx.translate(SPRITE_HALF, SPRITE_HALF);
  const baseColor = isYou ? '#2a8a5f' : (ARCHETYPES[arch] || ARCHETYPES.dervish).color;
  const glowColor = isYou ? '#5fc28d' : baseColor;
  cx.fillStyle = baseColor;
  cx.shadowColor = glowColor;
  cx.shadowBlur = 16;
  cx.beginPath(); cx.arc(0, 0, SPRITE_R, 0, TAU); cx.fill();
  cx.shadowBlur = 0;
  cx.strokeStyle = 'rgba(255,253,245,.5)';
  cx.lineWidth = 3;
  cx.beginPath(); cx.arc(0, 0, SPRITE_R - 4, 0, TAU); cx.stroke();
  cx.fillStyle = '#fbf6e8';
  cx.beginPath(); cx.arc(0, 0, SPRITE_R * 0.4, 0, TAU); cx.fill();
  cx.fillStyle = baseColor;
  cx.beginPath(); cx.arc(0, 0, SPRITE_R * 0.18, 0, TAU); cx.fill();
  _bodySprites[key] = c;
  return c;
}

// Camera
const cam = {x: WORLD.w/2, y: WORLD.h/2, zoom: 1, targetZoom: 1};

// Local-prediction tick for the local player position
function localPredict(dt){
  if (!me || !lastSnap || iAmDead) return;
  const meSnap = lastSnap.me;
  if (!meSnap) return;
  const sp = pSpeed(meSnap);
  if (localDashing > 0) {
    localDashing -= dt;
    me.vx = localDashDx * sp * DASH_SPEED_MULT;
    me.vy = localDashDy * sp * DASH_SPEED_MULT;
  } else {
    const i = intent();
    const tvx = i.mx*sp, tvy = i.my*sp;
    me.vx += (tvx-me.vx)*Math.min(1, dt*8);
    me.vy += (tvy-me.vy)*Math.min(1, dt*8);
  }
  if (localDashCd > 0) localDashCd = Math.max(0, localDashCd - dt);
  const r = pRadius(meSnap);
  me.x = Math.max(r, Math.min(WORLD.w-r, me.x + me.vx*dt));
  me.y = Math.max(r, Math.min(WORLD.h-r, me.y + me.vy*dt));
}

// Snapshot interpolation: render at (now - 100ms) so we have buffer.
// Writes _rx/_ry in place on each entity — no per-frame allocation.
// When the next snap is delayed, we extrapolate up to 80 ms past the latest
// snap using the prev→last segment velocity. This is the difference between
// "mob freezes for a frame, then teleports forward" and "mob keeps moving
// smoothly even when packets are jittery" — the visible stutter user sees.
const INTERP_DELAY_MS = 100;
const EXTRAP_CAP_MS = 80;
function applyInterp(){
  if (!lastSnap) return;
  const renderTime = performance.now() - INTERP_DELAY_MS;
  const span = prevSnap ? (snapRecvAt - prevSnapRecvAt) : 0;
  const canInterp = prevSnap && span > 0;
  const prevP = canInterp ? prevSnap.byId : null;
  const prevE = canInterp ? prevSnap.eById : null;
  for (const p of lastSnap.players) {
    const prev = prevP && prevP.get(p.id);
    if (prev && renderTime <= snapRecvAt) {
      const t = Math.max(0, Math.min(1, (renderTime - prevSnapRecvAt) / span));
      p._rx = prev.x + (p.x - prev.x) * t;
      p._ry = prev.y + (p.y - prev.y) * t;
    } else if (prev) {
      const overshoot = Math.min(EXTRAP_CAP_MS, renderTime - snapRecvAt);
      p._rx = p.x + (p.x - prev.x) / span * overshoot;
      p._ry = p.y + (p.y - prev.y) / span * overshoot;
    } else { p._rx = p.x; p._ry = p.y; }
  }
  for (const e of lastSnap.enemies) {
    const prev = prevE && prevE.get(e.id);
    if (prev && renderTime <= snapRecvAt) {
      const t = Math.max(0, Math.min(1, (renderTime - prevSnapRecvAt) / span));
      e._rx = prev.x + (e.x - prev.x) * t;
      e._ry = prev.y + (e.y - prev.y) * t;
    } else if (prev) {
      const overshoot = Math.min(EXTRAP_CAP_MS, renderTime - snapRecvAt);
      e._rx = e.x + (e.x - prev.x) / span * overshoot;
      e._ry = e.y + (e.y - prev.y) / span * overshoot;
    } else { e._rx = e.x; e._ry = e.y; }
  }
  // Local player overrides interpolated position with prediction.
  if (lastSnap.me && me && !iAmDead) {
    lastSnap.me._rx = me.x;
    lastSnap.me._ry = me.y;
  }
}

// ===== Render =====
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;

  // Send input ~30Hz
  if (now - lastInputSentAt > 33) {
    sendInput();
    lastInputSentAt = now;
  }

  // local prediction
  localPredict(dt);

  // interpolate other entities once per frame (writes _rx/_ry in place)
  applyInterp();

  // Client-side visual sparks where my blade LINE overlaps an enemy.
  // Cosmetic only — server is authoritative for damage AND already emits
  // dmg events at the impact point. So this is "bridge the 100 ms latency"
  // sugar; we keep it sparse. Cooldown 0.22 s (was 0.08), 1 particle (was 2),
  // bail entirely when particle pressure is high. With 4 blades × 5 nearby
  // mobs the old config was producing 500 particles/sec sustained.
  if (lastSnap && lastSnap.me && me && !iAmDead && particles.length < 100) {
    const meSnap = lastSnap.me;
    const tBlade = lastSnap.t + (now - snapRecvAt - INTERP_DELAY_MS) / 1000;
    const innerR = pBladeInner(meSnap);
    const outerR = pBladeRadius(meSnap);
    const bs = pBladeSize(meSnap);
    for (let i = 0; i < meSnap.bc; i++) {
      const ang = tBlade * meSnap.bs + (i / meSnap.bc) * TAU;
      const ux = Math.cos(ang), uy = Math.sin(ang);
      for (const e of lastSnap.enemies) {
        const dxp = e._rx - me.x, dyp = e._ry - me.y;
        const proj = dxp * ux + dyp * uy;
        if (proj < innerR - bs || proj > outerR + bs) continue;
        const tProj = proj < innerR ? innerR : (proj > outerR ? outerR : proj);
        const cx = me.x + ux * tProj, cy = me.y + uy * tProj;
        const px2 = e._rx - cx, py2 = e._ry - cy;
        const rr = bs + e.r;
        if (px2 * px2 + py2 * py2 < rr * rr) {
          const key = i + '_' + e.id;
          if ((bladeSparkT.get(key) || 0) + 0.22 < tBlade) {
            bladeSparkT.set(key, tBlade);
            burst(cx, cy, '#fff7e0', 1, 60);
          }
        }
      }
    }
  }

  // Periodic GC of stale spark cooldowns. The 0.08 s gating means a key
  // that hasn't been touched in 5 s is safely discardable — the cooldown
  // has long since elapsed.
  if (now - bladeSparkLastPurge > 5000) {
    bladeSparkLastPurge = now;
    bladeSparkT.clear();
  }

  // Tick the level-up offer timer + auto-hide on expiry (server will also
  // auto-pick option[0] and emit levelup_resolved).
  if (lvlOffer) {
    const remain = Math.max(0, lvlOffer.deadline - now);
    lvlTimerEl.textContent = (remain / 1000).toFixed(1) + 's';
    if (remain <= 0) hideLvlOffer();
  }

  // particles, floats, rings, shake
  for (const pt of particles) { pt.life -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx*=0.92; pt.vy*=0.92; }
  for (let i = particles.length-1; i>=0; i--) if (particles[i].life<=0) particles.splice(i,1);
  for (const f of floats) { f.life -= dt; f.y += f.vy*dt; f.vy*=0.94; }
  for (let i = floats.length-1; i>=0; i--) if (floats[i].life<=0) floats.splice(i,1);
  for (const r of rings) r.life -= dt;
  for (let i = rings.length-1; i>=0; i--) if (rings[i].life<=0) rings.splice(i,1);
  shake = Math.max(0, shake - dt);
  deathFlash = Math.max(0, deathFlash - dt*1.5);
  levelUpFlash = Math.max(0, levelUpFlash - dt*1.4);
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;
  }

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function render(){
  ctx.clearRect(0,0,VW,VH);
  if (!lastSnap) {
    drawBgEmpty();
    return;
  }

  // figure out my snapshot for camera/HUD
  const meSnap = lastSnap.me;
  const camAnchor = (me && meSnap && !iAmDead)
    ? { x: me.x, y: me.y, m: meSnap.m }
    : (meSnap || { x: WORLD.w/2, y: WORLD.h/2, m: 10 });

  // camera follow + zoom
  const targetZoom = 1 / pView(camAnchor);
  cam.targetZoom = targetZoom;
  // smooth
  const dt = 1/60;
  cam.zoom += (cam.targetZoom - cam.zoom) * dt * 2.5;
  cam.x += (camAnchor.x - cam.x) * Math.min(1, dt*6);
  cam.y += (camAnchor.y - cam.y) * Math.min(1, dt*6);

  let sx=0,sy=0;
  if (shake>0) { const s = shake*10; sx=(Math.random()*2-1)*s; sy=(Math.random()*2-1)*s; }
  const z = cam.zoom;
  ctx.save();
  ctx.translate(VW/2+sx, VH/2+sy);
  ctx.scale(z,z);
  ctx.translate(-cam.x, -cam.y);

  const vx0 = cam.x - VW/2/z, vy0 = cam.y - VH/2/z;
  const vx1 = cam.x + VW/2/z, vy1 = cam.y + VH/2/z;

  drawBg(vx0,vy0,vx1,vy1);

  // shrines
  for (const s of lastSnap.shrines) {
    if (s.x<vx0-50||s.x>vx1+50||s.y<vy0-50||s.y>vy1+50) continue;
    const active = s.c===1;
    const pulse = 1 + Math.sin(performance.now()/500 + s.x*0.01)*0.15;
    ctx.save(); ctx.translate(s.x,s.y);
    if (active) {
      ctx.strokeStyle='rgba(42,138,95,.35)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,32*pulse*1.4,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,32*pulse,0,TAU); ctx.stroke();
      ctx.fillStyle='#2a8a5f';
      ctx.fillRect(-3,-12,6,24); ctx.fillRect(-12,-3,24,6);
    } else {
      ctx.strokeStyle='rgba(122,117,104,.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,32,0,TAU); ctx.stroke();
      ctx.fillStyle='rgba(122,117,104,.3)';
      ctx.fillRect(-2,-10,4,20); ctx.fillRect(-10,-2,20,4);
      ctx.strokeStyle='#2a8a5f'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(0,0,30, -Math.PI/2, -Math.PI/2 + (1-s.cd/12)*TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // gems
  const tNow = performance.now()/1000;
  for (const g of lastSnap.gems) {
    if (g.x<vx0-20||g.x>vx1+20||g.y<vy0-20||g.y>vy1+20) continue;
    const pulse = 1 + Math.sin(tNow*8 + g.x*0.01)*0.18;
    const r = g.b ? 6 : 5;
    ctx.fillStyle = g.b ? '#d94a5e' : '#2a8a5f';
    ctx.shadowColor = g.b ? '#d94a5e' : '#5fc28d';
    ctx.shadowBlur=6;
    ctx.save();
    ctx.translate(g.x,g.y); ctx.rotate(Math.PI/4 + tNow*1.5);
    ctx.fillRect(-r*pulse,-r*pulse,r*2*pulse,r*2*pulse);
    ctx.restore();
    ctx.shadowBlur=0;
  }

  // power-up orbs — pulsing diamonds with kind-specific color and inner glyph.
  if (lastSnap.powerups) {
    const pwCol = { shield:'#ffd455', berserk:'#d94a5e', magnet:'#3a8db5', slowmo:'#8a5b9c' };
    const pwGlyph = { shield:'S', berserk:'B', magnet:'M', slowmo:'T' };
    for (const pu of lastSnap.powerups) {
      if (pu.x < vx0 - 60 || pu.x > vx1 + 60 || pu.y < vy0 - 60 || pu.y > vy1 + 60) continue;
      const c = pwCol[pu.k] || '#fff';
      const fading = pu.l < 5;
      const blink = fading && Math.floor(performance.now() / 120) % 2 === 0;
      const pulse = 1 + 0.22 * Math.sin(performance.now() / 180);
      ctx.save();
      ctx.translate(pu.x, pu.y);
      // Outer aura.
      ctx.strokeStyle = c;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = -performance.now() / 80;
      ctx.beginPath(); ctx.arc(0, 0, 28 * pulse, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      if (!blink) {
        // Diamond body.
        ctx.rotate(performance.now() / 600);
        ctx.fillStyle = c;
        ctx.shadowColor = c;
        ctx.shadowBlur = 16;
        const r = 18 * pulse;
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        // Glyph in the center.
        ctx.rotate(-performance.now() / 600);   // counter-rotate so glyph stays upright
        ctx.fillStyle = '#fbf6e8';
        ctx.font = "700 14px Space Grotesk, sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText(pwGlyph[pu.k] || '?', 0, 5);
      }
      ctx.restore();
    }
  }

  // augment orbs (level-up pickups in world)
  if (lastSnap.augments) {
    for (const a of lastSnap.augments) {
      if (a.x<vx0-40||a.x>vx1+40||a.y<vy0-40||a.y>vy1+40) continue;
      const tagCol = a.tg==='heal' ? '#d94a5e' : (a.tg==='shape' ? '#3a8db5' : (a.tg==='risk' ? '#8a5b9c' : '#2a8a5f'));
      const mine = a.o === myId;
      const fading = a.l < 5;
      const blink = fading && Math.floor(performance.now()/120)%2===0;
      const pulse = 1 + Math.sin(performance.now()/200 + a.x*0.01)*0.18;
      const r = 18 * pulse;
      ctx.save();
      ctx.translate(a.x, a.y);
      // outer ring (mine vs anyone)
      const ringCol = mine ? '#2a8a5f' : 'rgba(122,117,104,.55)';
      ctx.strokeStyle = ringCol;
      ctx.lineWidth = 2;
      ctx.setLineDash(mine ? [] : [4,4]);
      ctx.lineDashOffset = -performance.now()/80;
      ctx.beginPath(); ctx.arc(0,0,r+8,0,TAU); ctx.stroke();
      ctx.setLineDash([]);
      // diamond body
      if (!blink){
        ctx.fillStyle = tagCol;
        ctx.shadowColor = tagCol;
        ctx.shadowBlur = 14;
        ctx.rotate(Math.PI/4 + performance.now()/600);
        ctx.fillRect(-r, -r, r*2, r*2);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,253,245,.7)';
        ctx.fillRect(-r*0.4, -r*0.4, r*0.8, r*0.8);
      }
      ctx.restore();
      // label above
      ctx.font = "600 11px DM Mono, monospace";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,253,245,.85)';
      const w = ctx.measureText(a.n).width + 10;
      ctx.fillRect(a.x - w/2, a.y - r - 18, w, 14);
      ctx.fillStyle = tagCol;
      ctx.fillText(a.n, a.x, a.y - r - 8);
    }
  }

  // Meteor warnings — telegraph rings + falling fireball. Each meteor's t
  // counts down 1.5s → 0; we draw the impact circle on the ground (red,
  // pulsing, brighter as t→0) and the meteor falling toward it from above.
  if (lastSnap.meteors && lastSnap.meteors.length) {
    for (const m of lastSnap.meteors) {
      if (m.x < vx0 - 200 || m.x > vx1 + 200 || m.y < vy0 - 200 || m.y > vy1 + 200) continue;
      const urgency = 1 - Math.max(0, m.t / 1.5);   // 0 → 1 as time runs out
      // Ground impact ring — pulsing, gets opaque + thick as urgency rises.
      ctx.save();
      ctx.translate(m.x, m.y);
      const pulse = 1 + 0.06 * Math.sin(performance.now() / 70);
      ctx.strokeStyle = `rgba(217,74,94,${0.4 + urgency * 0.5})`;
      ctx.lineWidth = 2 + urgency * 4;
      ctx.setLineDash([12, 8]);
      ctx.lineDashOffset = -performance.now() / 30;
      ctx.beginPath(); ctx.arc(0, 0, m.r * pulse, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = `rgba(217,74,94,${0.05 + urgency * 0.18})`;
      ctx.beginPath(); ctx.arc(0, 0, m.r, 0, TAU); ctx.fill();
      // Falling fireball — a small comet streak above the impact point.
      const fallH = (m.t / 1.5) * 220;
      const fy = -fallH;
      const grd = ctx.createRadialGradient(0, fy, 2, 0, fy, 18);
      grd.addColorStop(0, '#fff7e0');
      grd.addColorStop(0.4, '#ffd455');
      grd.addColorStop(1, 'rgba(217,74,94,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, fy, 18, 0, TAU); ctx.fill();
      // Trail
      ctx.strokeStyle = 'rgba(255,212,85,.4)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(0, fy + 50); ctx.stroke();
      ctx.restore();
    }
  }

  // mobs (interpolated)
  for (const e of lastSnap.enemies) {
    const ex = e._rx, ey = e._ry;
    if (ex<vx0-30||ex>vx1+30||ey<vy0-30||ey>vy1+30) continue;
    ctx.save(); ctx.translate(ex,ey);
    const color = e.k==='champion' ? '#ffd455'
               : e.k==='tank' ? '#d94a5e'
               : e.k==='fast' ? '#e09f3e'
               : '#7a7568';
    if (e.k === 'champion') {
      // Pulsing aura ring for visibility through chaos.
      const pulse = 0.6 + 0.4 * Math.sin(performance.now()/180);
      ctx.strokeStyle = `rgba(255,212,85,${0.5 * pulse})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,e.r + 10 + pulse*4, 0, TAU); ctx.stroke();
      ctx.shadowColor = color; ctx.shadowBlur = 18;
      ctx.fillStyle = color;
      // 6-point star-ish shape
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU + performance.now()/700;
        const r = e.r * (i % 2 === 0 ? 1.0 : 0.78);
        if (i === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
    } else {
      // Per-kind body. Summoner = hexagon, Exploder = pulsing orange disc,
      // Tank = square, Fast = diamond, Grunt = circle.
      const kindCol = e.k === 'summoner' ? '#8a5b9c'
                    : e.k === 'exploder' ? '#e09f3e'
                    : color;
      ctx.fillStyle = kindCol;
      ctx.shadowColor = kindCol; ctx.shadowBlur = 4;
      if (e.k === 'fast') {
        ctx.beginPath(); ctx.moveTo(0,-e.r); ctx.lineTo(e.r,0); ctx.lineTo(0,e.r); ctx.lineTo(-e.r,0); ctx.closePath(); ctx.fill();
      } else if (e.k === 'tank') {
        ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);
        ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2;
        ctx.strokeRect(-e.r+3,-e.r+3,e.r*2-6,e.r*2-6);
      } else if (e.k === 'summoner') {
        // Hexagon, slowly rotating, dark inner core.
        ctx.beginPath();
        const rot = performance.now() / 1500;
        for (let h = 0; h < 6; h++) {
          const a = rot + h * TAU / 6;
          const x = Math.cos(a) * e.r, y = Math.sin(a) * e.r;
          if (h === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1a1d24';
        ctx.beginPath(); ctx.arc(0, 0, e.r * 0.45, 0, TAU); ctx.fill();
      } else if (e.k === 'exploder') {
        // Pulsing fuse — closer to detonation = brighter.
        const fuse = 1 + 0.18 * Math.sin(performance.now() / 110);
        ctx.beginPath(); ctx.arc(0, 0, e.r * fuse, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#d94a5e';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, e.r * fuse + 2, 0, TAU); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.fill();
      }
      // Danger-zone tint — red sheen on top of the body.
      if (e.dz) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(217,74,94,.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, e.r + 3, 0, TAU); ctx.stroke();
      }
    }
    ctx.shadowBlur=0;
    if (e.h<e.mh){
      ctx.fillStyle='rgba(26,29,36,.3)'; ctx.fillRect(-e.r,-e.r-7,e.r*2,3);
      ctx.fillStyle = e.k==='champion' ? '#ffd455' : '#d94a5e';
      ctx.fillRect(-e.r,-e.r-7,e.r*2*(e.h/e.mh),3);
    }
    ctx.restore();
  }

  // rings
  for (const r of rings) {
    const a = r.life / r.max;
    const rad = r.r0 + (r.r1-r.r0)*(1-a);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3*a;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(r.x,r.y,rad,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;

  // players (interpolated). _rx/_ry already hold render position incl. local me-prediction.
  // Sort by mass (smaller drawn first → bigger players on top); cache sorted view per snap.
  if (lastSnap._sortedPlayers === undefined || lastSnap._sortedPlayersAt !== snapRecvAt) {
    lastSnap._sortedPlayers = lastSnap.players.slice().sort((a,b)=>a.m-b.m);
    lastSnap._sortedPlayersAt = snapRecvAt;
  }
  for (const p of lastSnap._sortedPlayers) {
    if (p.d) continue;
    if (p._rx<vx0-200||p._rx>vx1+200||p._ry<vy0-200||p._ry>vy1+200) continue;
    drawPlayer(p);
  }

  // particles
  for (const pt of particles) {
    const a = pt.life/pt.max;
    ctx.fillStyle = pt.color; ctx.globalAlpha = a;
    ctx.fillRect(pt.x-2, pt.y-2, 4,4);
  }
  ctx.globalAlpha=1;

  // floats
  for (const f of floats) {
    const a = Math.max(0, Math.min(1, f.life/f.max));
    ctx.font = `700 ${f.size}px Space Grotesk, sans-serif`;
    ctx.textAlign='center';
    ctx.globalAlpha = a;
    ctx.fillStyle='rgba(255,253,245,.95)';
    ctx.fillText(f.text, f.x+1, f.y+1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // overlays
  if (deathFlash>0){
    ctx.fillStyle='#d94a5e';
    ctx.globalAlpha = deathFlash*0.3;
    ctx.fillRect(0,0,VW,VH);
    ctx.globalAlpha=1;
  }
  if (levelUpFlash > 0) {
    ctx.fillStyle = '#5fc28d';
    ctx.globalAlpha = levelUpFlash * 0.22;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }
  // Active combo readout above the local player.
  if (comboCount >= 2 && meSnap && !iAmDead) {
    const remain = comboTimer / COMBO_WINDOW;
    ctx.font = `700 ${20 + Math.min(20, comboCount*1.5)}px Space Grotesk, sans-serif`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.55 + 0.45 * remain;
    ctx.fillStyle = 'rgba(255,253,245,.85)';
    ctx.fillText(`x${comboCount}`, VW/2 + 1, 60);
    ctx.fillStyle = '#ffaa44';
    ctx.fillText(`x${comboCount}`, VW/2, 60 - 1);
    ctx.globalAlpha = 1;
  }
  if (meSnap && !iAmDead) {
    const hpRatio = meSnap.h / meSnap.mh;
    if (hpRatio < 0.35) {
      const intensity = (0.35 - hpRatio) / 0.35;
      const grad = ctx.createRadialGradient(VW/2,VH/2, Math.min(VW,VH)*0.35, VW/2,VH/2, Math.max(VW,VH)*0.7);
      grad.addColorStop(0, 'rgba(217,74,94,0)');
      grad.addColorStop(1, `rgba(217,74,94,${intensity*0.45})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,VW,VH);
    }
    if (meSnap.if > 0) {
      ctx.font = "500 12px DM Mono, monospace";
      ctx.textAlign='center';
      ctx.fillStyle='rgba(42,138,95,'+Math.min(0.7,meSnap.if)+')';
      ctx.fillText(`SAFE · ${meSnap.if.toFixed(1)}s`, VW/2, 100);
    }
  }

  drawMini();
  updateHUD(meSnap);
}

function drawBgEmpty(){
  ctx.fillStyle='#fbf6e8';
  ctx.fillRect(0,0,VW,VH);
}
function drawBg(vx0,vy0,vx1,vy1){
  ctx.fillStyle='#fbf6e8';
  ctx.fillRect(0,0,WORLD.w,WORLD.h);
  const gs=80;
  ctx.fillStyle='rgba(26,29,36,.07)';
  const x0=Math.floor(vx0/gs)*gs, y0=Math.floor(vy0/gs)*gs;
  for(let x=x0;x<vx1;x+=gs)for(let y=y0;y<vy1;y+=gs) ctx.fillRect(x-1,y-1,2,2);
  ctx.strokeStyle='rgba(217,74,94,.5)';
  ctx.lineWidth=4/cam.zoom;
  ctx.strokeRect(0,0,WORLD.w,WORLD.h);
  ctx.strokeStyle='rgba(217,74,94,.15)';
  ctx.lineWidth=1/cam.zoom;
  for(let i=0;i<24;i++){
    const t=i/24;
    ctx.beginPath();
    ctx.moveTo(t*WORLD.w,0); ctx.lineTo(t*WORLD.w-30,30); ctx.stroke();
    ctx.moveTo(t*WORLD.w,WORLD.h); ctx.lineTo(t*WORLD.w-30,WORLD.h-30); ctx.stroke();
    ctx.moveTo(0,t*WORLD.h); ctx.lineTo(30,t*WORLD.h-30); ctx.stroke();
    ctx.moveTo(WORLD.w,t*WORLD.h); ctx.lineTo(WORLD.w-30,t*WORLD.h-30); ctx.stroke();
  }
  ctx.strokeStyle='rgba(26,29,36,.06)';
  ctx.lineWidth=1.5/cam.zoom;
  ctx.beginPath(); ctx.arc(WORLD.w/2,WORLD.h/2,500,0,TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(WORLD.w/2,WORLD.h/2,250,0,TAU); ctx.stroke();
  // Danger zone — pulsing red ring at the heart of the map. Mobs here are
  // tougher but drop double XP. Visible from anywhere on the map.
  const dzPulse = 1 + 0.04 * Math.sin(performance.now() / 600);
  ctx.strokeStyle = 'rgba(217,74,94,.32)';
  ctx.lineWidth = 6 / cam.zoom;
  ctx.setLineDash([22 / cam.zoom, 14 / cam.zoom]);
  ctx.lineDashOffset = -performance.now() / 60;
  ctx.beginPath(); ctx.arc(WORLD.w/2, WORLD.h/2, 600 * dzPulse, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(217,74,94,.04)';
  ctx.beginPath(); ctx.arc(WORLD.w/2, WORLD.h/2, 600, 0, TAU); ctx.fill();
}

function hexRgb(h){const v=parseInt(h.slice(1),16);return `${(v>>16)&255},${(v>>8)&255},${v&255}`}

function drawPlayer(p){
  const isYou = p.id === myId;
  const arch = ARCHETYPES[p.a] || ARCHETYPES.dervish;
  const col = arch.color;
  const r = pRadius(p);
  const px = p._rx, py = p._ry;

  ctx.save();
  ctx.translate(px, py);

  // grace halo
  if (p.if>0){
    const a = Math.min(0.5, p.if*0.4);
    ctx.strokeStyle = isYou ? `rgba(42,138,95,${a})` : `rgba(122,117,104,${a*0.8})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([6,6]);
    ctx.lineDashOffset = -performance.now()/100;
    ctx.beginPath(); ctx.arc(0,0,r+8,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  // magnet ring (you only)
  if (isYou) {
    ctx.strokeStyle='rgba(42,138,95,.08)';
    ctx.lineWidth=1/cam.zoom;
    ctx.beginPath(); ctx.arc(0,0,140,0,TAU); ctx.stroke();
  }

  // Killer aura — pulsing red ring around any player who recently ate
  // another player. Visible signal: "this one's hot, watch out."
  if (p.kg > 0) {
    const intensity = Math.min(1, p.kg / 4);
    const pulse = 1 + 0.18 * Math.sin(performance.now() / 110);
    ctx.strokeStyle = `rgba(217,74,94,${0.55 * intensity})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, (r + 9) * pulse, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(217,74,94,${0.25 * intensity})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, (r + 18) * pulse, 0, TAU); ctx.stroke();
  }

  // Magnet powerup — wide blue ring expanding outward.
  if (p.mg > 0) {
    const t = performance.now() / 240;
    const expand = (Math.sin(t) * 0.5 + 0.5);
    ctx.strokeStyle = 'rgba(58,141,181,.45)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r + 16 + expand * 12, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(58,141,181,.20)';
    ctx.beginPath(); ctx.arc(0, 0, r + 28 + expand * 16, 0, TAU); ctx.stroke();
  }

  // body — single drawImage from cached sprite atlas (5 path ops + shadow → 1 op)
  const sprite = getBodySprite(p.a, isYou);
  const scale = r / SPRITE_R;
  const halfDraw = SPRITE_HALF * scale;
  ctx.drawImage(sprite, -halfDraw, -halfDraw, halfDraw * 2, halfDraw * 2);

  // Shield powerup — golden bubble around the body.
  if (p.sh > 0) {
    const intensity = Math.min(1, p.sh / 2);
    const pulse = 1 + 0.06 * Math.sin(performance.now() / 90);
    ctx.strokeStyle = `rgba(255,212,85,${0.7 * intensity})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, (r + 6) * pulse, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,212,85,${0.3 * intensity})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, (r + 14) * pulse, 0, TAU); ctx.stroke();
  }

  // Berserk powerup — flickering red edge.
  if (p.bk > 0) {
    const flicker = 0.5 + 0.5 * Math.random();
    ctx.strokeStyle = `rgba(217,74,94,${0.65 * flicker})`;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, TAU); ctx.stroke();
  }

  // Slow-mo aura — a faint purple field on the player who triggered it.
  if (p.sm > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
    ctx.strokeStyle = `rgba(138,91,156,${0.4 + 0.2 * pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r + 22, 0, TAU); ctx.stroke();
  }

  // Dash-execute window — brief golden afterimage on the body.
  if (p.ex > 0) {
    ctx.strokeStyle = `rgba(255,212,85,${0.7 * (p.ex / 0.6)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  // Blades are LINES extending out from the body. Each blade is a tapered
  // sword-shape from innerR to outerR along its rotating angle. As mass /
  // upgrades grow, outerR extends, the blade visibly stretches further.
  // Server clock keeps visual rotation synced to authoritative hit detection.
  const tNow = lastSnap.t + (performance.now() - snapRecvAt) / 1000;
  const tB = isYou ? tNow : (tNow - INTERP_DELAY_MS / 1000);
  const innerR = pBladeInner(p), outerR = pBladeRadius(p), bs = pBladeSize(p);
  const len = outerR - innerR;
  // Single "ghost trail" per blade — only for self, single shadow op, no
  // per-tick alpha-loop allocations. Cuts ~12 fillRect+shadow calls per
  // player per frame compared to the old 4-ghost dot trail.
  for (let i = 0; i < p.bc; i++){
    const ang = (p.b ? p.sp : 0) + tB * p.bs + (i / p.bc) * TAU;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    if (isYou) {
      // Faint sweep echo behind current angle — gives a sense of motion.
      const trailAng = -0.08 * Math.sign(p.bs) * Math.min(1, Math.abs(p.bs) / 4);
      ctx.save();
      ctx.rotate(trailAng);
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#5fc28d';
      ctx.fillRect(innerR, -bs * 0.4, len, bs * 0.8);
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.shadowColor = '#5fc28d';
      ctx.shadowBlur = 8;
    }
    // Tapered blade body — a sword silhouette. Wider at the hilt, point at tip.
    ctx.fillStyle = '#1a1d24';
    ctx.beginPath();
    ctx.moveTo(innerR, -bs * 0.65);
    ctx.lineTo(outerR - bs * 0.4, -bs * 0.35);
    ctx.lineTo(outerR, 0);
    ctx.lineTo(outerR - bs * 0.4, bs * 0.35);
    ctx.lineTo(innerR, bs * 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Edge highlight (one stroke instead of two fillRects).
    // Golden trim if any evolution is active — visible "your build paid off"
    // signal. ev field is a bitmask: 1=executioner 2=cyclone 4=eternal_arc 8=vampire.
    const isEvo = (p.ev || 0) > 0;
    ctx.strokeStyle = isEvo ? '#ffd455' : (isYou ? '#5fc28d' : col);
    ctx.lineWidth = isEvo ? 2 : 1.5;
    ctx.beginPath();
    ctx.moveTo(innerR + 4, -bs * 0.5);
    ctx.lineTo(outerR - bs * 0.5, -bs * 0.22);
    ctx.stroke();
    if (isEvo) {
      // Subtle glow line on the back edge too — only paid for visually
      // when the player has actually unlocked an evo.
      ctx.strokeStyle = 'rgba(255,212,85,.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(innerR + 4, bs * 0.5);
      ctx.lineTo(outerR - bs * 0.5, bs * 0.22);
      ctx.stroke();
    }
    // Hilt — circular guard at the inner end.
    ctx.fillStyle = isYou ? '#2a8a5f' : col;
    ctx.beginPath();
    ctx.arc(innerR, 0, bs * 0.55, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // name + hp
  const nameY = py - r - 16;
  ctx.font = "600 13px Space Grotesk, sans-serif";
  ctx.textAlign='center';
  const nameW = ctx.measureText(p.n).width + 14;
  ctx.fillStyle='rgba(255,253,245,.85)';
  ctx.fillRect(px-nameW/2, nameY-11, nameW, 16);
  ctx.fillStyle = isYou ? '#2a8a5f' : col;
  ctx.fillText(p.n, px, nameY+1);
  const w = Math.max(50, r*2);
  ctx.fillStyle='rgba(26,29,36,.15)';
  ctx.fillRect(px-w/2, py-r-7, w, 4);
  ctx.fillStyle = p.h/p.mh>0.5 ? (isYou?'#2a8a5f':'#5fc28d') : (p.h/p.mh>0.25?'#e09f3e':'#d94a5e');
  ctx.fillRect(px-w/2, py-r-7, w*(p.h/p.mh), 4);
}

function drawMini(){
  if (!lastSnap) return;
  const W=mini.width, H=mini.height;
  mctx.clearRect(0,0,W,H);
  mctx.fillStyle='rgba(251,246,232,.95)';
  mctx.fillRect(0,0,W,H);
  mctx.strokeStyle='rgba(26,29,36,.15)'; mctx.lineWidth=2;
  mctx.strokeRect(1,1,W-2,H-2);
  const sx=W/WORLD.w, sy=H/WORLD.h;
  for (const s of lastSnap.shrines) {
    if (s.c===1) {
      mctx.fillStyle='rgba(42,138,95,.7)';
      mctx.beginPath(); mctx.arc(s.x*sx,s.y*sy,4,0,TAU); mctx.fill();
    }
  }
  for (const e of lastSnap.enemies) {
    if (e.k !== 'champion') continue;
    mctx.fillStyle = '#ffd455';
    mctx.shadowColor = '#ffd455'; mctx.shadowBlur = 6;
    mctx.beginPath(); mctx.arc(e.x*sx, e.y*sy, 4, 0, TAU); mctx.fill();
    mctx.shadowBlur = 0;
  }
  if (lastSnap.augments){
    for (const a of lastSnap.augments){
      if (a.o !== myId) continue;
      mctx.fillStyle = '#3a8db5';
      mctx.shadowColor = '#3a8db5'; mctx.shadowBlur = 6;
      mctx.save();
      mctx.translate(a.x*sx, a.y*sy); mctx.rotate(Math.PI/4);
      mctx.fillRect(-4,-4,8,8);
      mctx.restore();
      mctx.shadowBlur = 0;
    }
  }
  for (const p of lastSnap.players) {
    if (p.d) continue;
    const arch = ARCHETYPES[p.a] || ARCHETYPES.dervish;
    if (p.id===myId){
      mctx.fillStyle='#2a8a5f'; mctx.shadowColor='#5fc28d'; mctx.shadowBlur=6;
      const sz = 3 + Math.sqrt(p.m)*0.22;
      mctx.beginPath(); mctx.arc(p.x*sx,p.y*sy,sz,0,TAU); mctx.fill();
      mctx.shadowBlur=0;
    } else {
      mctx.fillStyle = arch.color;
      mctx.globalAlpha = 0.8;
      const sz = 2 + Math.sqrt(p.m)*0.18;
      mctx.beginPath(); mctx.arc(p.x*sx,p.y*sy,sz,0,TAU); mctx.fill();
      mctx.globalAlpha=1;
    }
  }
  const vw = VW/cam.zoom*sx, vh = VH/cam.zoom*sy;
  mctx.strokeStyle='rgba(26,29,36,.25)'; mctx.lineWidth=1.5;
  mctx.strokeRect(cam.x*sx - vw/2, cam.y*sy - vh/2, vw, vh);
}

let _lastBoardSnapAt = 0;
let _lastBoardCollapsed = null;
let _lastBuildSig = '';
function updateHUD(meSnap){
  if (!meSnap) return;
  hpFill.style.width = (meSnap.h/meSnap.mh*100)+'%';
  hpNum.textContent = Math.ceil(meSnap.h);
  xpFill.style.width = (meSnap.xp/meSnap.xn*100)+'%';
  lvEl.textContent = meSnap.l;
  massVal.textContent = Math.floor(meSnap.m);
  killsVal.textContent = myKillCount;
  pingVal.textContent = pingMs ? pingMs+'ms' : '—';
  // dash button cooldown (tracked locally — synced when we predict a dash)
  if (localDashCd > 0) {
    dashBtn.disabled = true;
    dashCdEl.textContent = localDashCd.toFixed(1) + 's';
  } else {
    dashBtn.disabled = false;
    dashCdEl.textContent = 'READY';
  }
  // leaderboard — only rebuild when a new snapshot arrives or the panel toggles.
  const collapsed = board.classList.contains('collapsed');
  if (_lastBoardSnapAt !== snapRecvAt || _lastBoardCollapsed !== collapsed) {
    _lastBoardSnapAt = snapRecvAt;
    _lastBoardCollapsed = collapsed;
    const all = lastSnap.players.filter(x=>!x.d).slice().sort((a,b)=>b.m - a.m);
    let rows;
    if (collapsed) {
      const meIdx = all.findIndex(p=>p.id===myId);
      if (meIdx >= 0 && meIdx < 3) rows = all.slice(0,3);
      else if (meIdx >= 0) rows = [...all.slice(0,2), all[meIdx]];
      else rows = all.slice(0,3);
    } else {
      rows = all.slice(0,8);
    }
    boardRows.innerHTML = rows.map(x=>{
      const idx = all.indexOf(x)+1;
      return `<div class="row ${x.id===myId?'you':''}"><span class="rk">${idx}</span><span class="nm">${escapeHtml(x.n)}</span><span class="ms">${Math.floor(x.m)}</span></div>`;
    }).join('');
  }
  // build tags — only rebuild when the loadout actually changes.
  const buildSig = `${meSnap.a}|${meSnap.bc}|${meSnap.bs}|${meSnap.bz}|${meSnap.br}|${Math.round(meSnap.m)}`;
  if (buildSig !== _lastBuildSig) {
    _lastBuildSig = buildSig;
    buildTags.innerHTML = `
      <div class="tag archetype"><b>${ARCHETYPES[meSnap.a].name}</b></div>
      <div class="tag"><b>${meSnap.bc}</b> blades</div>
      <div class="tag">spin <b>${meSnap.bs.toFixed(1)}</b></div>
      <div class="tag">size <b>${Math.round(pBladeSize(meSnap))}</b></div>
      <div class="tag">reach <b>${Math.round(pBladeRadius(meSnap))}</b></div>
    `;
  }
}

// ===== Modals =====
function showStart(){
  card.innerHTML = `
    <h1>Blade.io</h1>
    <div class="sub">// alpha · live</div>
    <p>Eat shards. Grow. Hunt smaller players. Run from bigger ones.</p>
    <div class="nameRow">
      <input class="tag-in" id="nameIn" maxlength="14" placeholder="Your tag…" value="${escapeHtml(playerName==='PLAYER'?'':playerName)}" />
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:12px">// pick a class</div>
    <div class="archChips" id="archChips">
      ${Object.entries(ARCHETYPES).map(([k,a])=>`
        <button class="arch ${k===chosenArchetype?'sel':''}" data-k="${k}" style="border-color:${k===chosenArchetype?a.color:''}">
          <h4 style="color:${a.color}">${a.name}</h4>
          <div class="archDesc">${a.desc}</div>
          <div class="archStats">
            ${['DMG','REACH','SPIN'].map((n,j)=>{
              const v=[a.stats.dmg,a.stats.range,a.stats.speed][j];
              return `<div class="archBar"><span>${n}</span><div class="b"><i style="width:${v*100}%;background:${a.color}"></i></div></div>`;
            }).join('')}
          </div>
        </button>
      `).join('')}
    </div>
    <button class="btn" id="begin">Engage</button>
    <div class="small" id="connNote">connecting to server…</div>
  `;
  modal.classList.add('show');
  const nameIn = $('nameIn');
  if (!isTouch) setTimeout(()=>nameIn.focus(),50);
  $('archChips').addEventListener('click',(e)=>{
    const t = e.target.closest('.arch'); if (!t) return;
    chosenArchetype = t.dataset.k;
    if (ls) ls.setItem('blade_arch', chosenArchetype);
    $('archChips').querySelectorAll('.arch').forEach(el=>{
      const k=el.dataset.k, a=ARCHETYPES[k];
      el.classList.toggle('sel', k===chosenArchetype);
      el.style.borderColor = k===chosenArchetype ? a.color : '';
    });
  });
  const beginBtn = $('begin');
  const begin = () => {
    if (!connected) { $('connNote').textContent = 'still connecting…'; return; }
    let nm = nameIn.value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,14);
    if (!nm) nm = 'PLAYER' + Math.floor(Math.random()*99);
    playerName = nm;
    if (ls) ls.setItem('blade_name', nm);
    // Unlock the AudioContext on this user gesture (browser autoplay policy).
    ensureAudio();
    ws.send(JSON.stringify({type:'join', name:nm, archetype:chosenArchetype}));
    nameIn.blur();
  };
  beginBtn.onclick = begin;
  nameIn.addEventListener('keydown',(e)=>{ if (e.key==='Enter') begin(); });
  // poll connection
  const t = setInterval(()=>{
    if (connected) { $('connNote').textContent = 'press Engage to play'; clearInterval(t); }
  }, 200);
}

function showDeath(meSnap){
  // figure rank from snapshot at death
  const all = lastSnap.players.slice().sort((a,b)=>b.m - a.m);
  const rank = all.findIndex(p=>p.id===myId)+1;
  const mass = Math.floor(meSnap.m);
  const kills = myKillCount;
  card.innerHTML = `
    <h1>You died</h1>
    <div class="sub">// signal lost</div>
    <div class="endStats">
      <div><div class="lbl">Rank</div><div class="v" style="color:var(--ink)">#${rank}</div></div>
      <div><div class="lbl">Mass</div><div class="v" style="color:var(--you)">${mass}</div></div>
      <div><div class="lbl">Kills</div><div class="v" style="color:var(--hot)">${kills}</div></div>
    </div>
    <button class="btn" id="restart">Rejoin</button>
    <button class="btn" id="newRun" style="background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:8px">Change Class</button>
  `;
  deathFlash = 0.5;
  shake = 0.5;
  modal.classList.add('show');
  $('restart').onclick = () => {
    ws.send(JSON.stringify({type:'respawn', archetype: chosenArchetype}));
  };
  $('newRun').onclick = () => {
    showStart();
  };
}

function showRejected(reason){
  card.innerHTML = `
    <h1>Could not join</h1>
    <div class="sub">// ${escapeHtml(reason)}</div>
    <p>${escapeHtml(reason)}</p>
    <button class="btn" id="retry">Retry</button>
  `;
  modal.classList.add('show');
  $('retry').onclick = ()=>{ if (ws) ws.close(); setTimeout(()=>{ connect(); showStart(); }, 500); };
}

// ===== Boot =====
connect();
showStart();

document.addEventListener('visibilitychange',()=>{
  // nothing critical — server keeps simulating; our inputs just go idle when tab is hidden
});
</script>
</body>
</html>
